<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Confere — Quiz dos Sinais da Relação</title>

<style>
:root{
  --bg:#050505;
  --card:#101010;
  --line:#282828;
  --txt:#f5f5f5;
  --mut:#9b9b9b;
  --red:#ff2525;
  --rose:#a80f0f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;
}
.bg{position:fixed;border-radius:50%;filter:blur(95px);opacity:.3;pointer-events:none;z-index:0}
.fx1{width:340px;height:340px;background:var(--red);top:-130px;left:-110px}
.fx2{width:320px;height:320px;background:#4a0404;bottom:-120px;right:-100px}
#app{
  position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:24px 18px 46px;min-height:100vh;display:flex;flex-direction:column;
}
.fade{animation:fade .38s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:800;letter-spacing:.4px}
.brand svg{color:#fff;flex:0 0 auto}
.wm{font-weight:850;letter-spacing:-.2px;color:#fff}
.wm i{font-style:normal;color:var(--red)}
.hero{text-align:center;padding:6px 0 24px}
.appicon{
  width:98px;height:98px;margin:0 auto 16px;border-radius:24px;
  background:linear-gradient(160deg,#191919,#080808);border:1px solid #2e2e2e;
  display:grid;place-items:center;box-shadow:0 0 46px #ff25253d,0 20px 44px #000000aa;
}
.appicon svg{color:#fff;filter:drop-shadow(0 0 7px #ff252555)}
.hero-wm{display:block;font-size:50px;letter-spacing:-1.4px}
.slogan{color:#ececec;font-size:19.5px;font-weight:750;line-height:1.35;margin-top:14px}
.rule{width:76px;height:5px;border-radius:99px;background:var(--red);margin:20px auto 0}
.kicker{font-size:12px;font-weight:700;letter-spacing:2.4px;color:var(--red);text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top.end{justify-content:flex-end}
.chips{display:flex;gap:8px;align-items:center}
.sinais{
  font-size:11.5px;font-weight:800;letter-spacing:.8px;background:#ff252516;
  border:1px solid #ff252555;color:#ff9494;padding:6px 11px;border-radius:99px;
  white-space:nowrap;transition:.2s;
}
.sinais b{color:#fff;font-size:13px}
.sinais.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.3);box-shadow:0 0 18px #ff252588}}
.som{
  background:#ffffff0a;border:1px solid var(--line);color:var(--mut);font-size:11.5px;
  font-weight:800;letter-spacing:.8px;padding:6px 11px;border-radius:99px;cursor:pointer;
  font-family:inherit;transition:.2s;
}
.som:hover{border-color:var(--red);color:var(--txt)}
.som.off{opacity:.45;text-decoration:line-through}
.qnum{font-size:12.5px;color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;font-weight:700;margin:14px 0 9px}
.progress{height:8px;background:#ffffff14;border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff4444,var(--rose));transition:width .5s cubic-bezier(.22,1,.36,1)}
.card{background:#0f0f0fe6;border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:0 24px 60px #00000080}
h1{font-size:31px;line-height:1.14;margin:14px 0 12px;letter-spacing:-.5px}
h2{font-size:25px;line-height:1.2;margin:10px 0 10px}
.lead{color:var(--mut);font-size:16.5px;line-height:1.55}
.ticks{list-style:none;margin:22px 0 26px;display:grid;gap:12px}
.ticks li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;font-weight:600;line-height:1.4}
.ticks b{
  flex:0 0 22px;height:22px;border-radius:50%;background:#ff25251f;color:var(--red);
  display:grid;place-items:center;font-size:13px;margin-top:1px;
}
.btn{
  width:100%;padding:17px 18px;border:none;border-radius:16px;font-size:17px;font-weight:800;
  cursor:pointer;background:linear-gradient(90deg,#ff4444,#c11111);color:#fff;
  transition:transform .15s ease,filter .2s ease;letter-spacing:.3px;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn.rose{background:linear-gradient(90deg,#ff4444,#d10f0f);color:#fff}
.micro{font-size:12.5px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
.bonus{
  display:inline-block;font-size:11.5px;font-weight:850;letter-spacing:1.4px;text-transform:uppercase;
  background:#f5b30118;border:1px solid #f5b30166;color:#f5b301;padding:6px 12px;
  border-radius:99px;margin-bottom:12px;animation:fade .4s ease;
}
.qtext{font-size:22px;font-weight:750;line-height:1.35;margin:6px 0 22px}
.opts{display:grid;gap:11px}
.opt{
  width:100%;text-align:left;background:#161616;border:1.5px solid var(--line);color:var(--txt);
  padding:16px 15px;border-radius:15px;font-size:16.5px;font-weight:650;cursor:pointer;
  display:flex;align-items:center;gap:13px;transition:border-color .15s,transform .15s,background .15s;
}
.opt:hover{border-color:var(--red);transform:translateY(-2px)}
.opt:active{transform:scale(.985)}
.opt.sel{border-color:var(--red);background:#ff25251a}
.opt .badge{
  flex:0 0 30px;height:30px;border-radius:10px;background:#ffffff0f;border:1px solid var(--line);
  display:grid;place-items:center;font-size:13.5px;font-weight:800;color:var(--red);
}
.opt.sel .badge{background:var(--red);color:#fff;border-color:var(--red)}
.half-ico{
  width:56px;height:56px;border-radius:18px;background:#ff252514;border:1px solid #ff252544;
  display:grid;place-items:center;color:var(--red);font-size:26px;font-weight:800;margin-bottom:6px;
}
.half-sinais{
  display:inline-block;margin-top:14px;padding:10px 18px;border-radius:99px;font-size:14.5px;
  font-weight:750;background:#ff252514;border:1px solid #ff252550;color:#ff9d9d;
}
.half-sinais b{color:#fff;font-size:18px}
.spin{
  width:52px;height:52px;border-radius:50%;border:4px solid #ffffff14;border-top-color:var(--red);
  animation:sp .8s linear infinite;margin:0 auto 20px;
}
@keyframes sp{to{transform:rotate(360deg)}}
.calc-t{text-align:center;font-size:19px;font-weight:750}
.calc-s{text-align:center;color:var(--mut);font-size:14.5px;margin-top:8px}
.res-head{text-align:center}
.pill{
  display:inline-block;padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;margin-top:10px;border:1px solid;
}
.prof{
  display:inline-block;margin-top:12px;padding:8px 16px;border-radius:12px;font-size:14.5px;
  color:var(--mut);background:#ffffff08;border:1px solid var(--line);
}
.prof strong{color:var(--txt);font-weight:800}
.meta{font-size:13px;color:var(--mut);margin-top:12px;letter-spacing:.4px}
.ring{
  width:176px;height:176px;border-radius:50%;margin:26px auto 6px;display:grid;place-items:center;
}
.ringIn{
  width:76%;height:76%;border-radius:50%;background:#0a0a0a;border:1px solid var(--line);
  display:grid;place-items:center;text-align:center;
}
.ringIn span{font-size:46px;font-weight:850;line-height:1}
.ringIn em{font-style:normal;font-size:15px;color:var(--mut);font-weight:700}
.res-title{font-size:26px;font-weight:850;margin-top:16px;letter-spacing:-.3px}
.res-desc{color:var(--mut);font-size:15.5px;line-height:1.55;margin-top:10px}
.sect{margin-top:22px;background:#161616;border:1px solid var(--line);border-radius:18px;padding:18px 17px}
.sect h3{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--red);margin-bottom:13px}
.sect ul{list-style:none;display:grid;gap:11px}
.sect li{display:flex;gap:11px;font-size:15px;line-height:1.45;font-weight:600}
.sect li .dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px}
.sect ol{margin-left:19px;display:grid;gap:12px}
.sect ol li{font-size:15px;line-height:1.5;color:#d6d6d6}
.sect ol li::marker{color:var(--red);font-weight:800}
.cta-box{
  margin-top:24px;background:linear-gradient(165deg,#ff25252b,#1a0505);
  border:1px solid #ff252566;border-radius:22px;padding:24px 18px;text-align:center;
}
.cta-title{font-size:20px;font-weight:850;line-height:1.3;margin:10px 0 16px}
a.btn{display:block;text-align:center;text-decoration:none;line-height:1.2}
a.btn:hover{filter:brightness(1.1)}
.cta-note{font-size:12.5px;color:var(--mut);margin-top:12px;line-height:1.5}
.tk-wrap{
  display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);
  border-radius:14px;padding:12px 14px;background:#141414;margin-top:18px;
}
.tk-wrap:focus-within{border-color:#ff2525}
.tk-wrap.err{animation:shake .55s ease}
.tk-at{font-weight:800;font-size:18px;color:#ff2525}
.tk-in{
  flex:1;background:none;border:0;outline:none;color:#fff;
  font-size:17px;font-weight:700;font-family:inherit;min-width:0;
}
.tk-in::placeholder{color:#666;font-weight:600}
.tk-err{color:#ff2525;font-size:13px;margin-top:8px;display:none}
.tk-wrap.err~.tk-err{display:block}
.chat{background:#0d0d0d;border:1px solid var(--line);border-radius:16px;margin-top:16px;overflow:hidden}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ff2525,#7a0e0e);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.chat-name{font-weight:800;font-size:14.5px}
.chat-on{font-size:12px;color:#4ade80;display:flex;align-items:center;gap:5px}
.chat-on i{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block}
.bub-in{background:#1f1f1f;border-radius:4px 16px 16px 16px;padding:10px 14px;margin:14px;max-width:88%;font-size:15.5px;line-height:1.45}
.tm{display:block;font-size:11px;color:#888;margin-top:6px;text-align:right}
.rush{text-align:center;font-size:12.5px;color:#ffb4b4;margin-top:14px;font-weight:700}
.cta-loss{font-size:14px;color:#ffb4b4;margin:10px 0 2px;line-height:1.5}
.trust{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.trust span{font-size:11.5px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.who{font-size:13px;color:var(--mut);margin-top:6px}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff252566}70%{box-shadow:0 0 0 14px #ff252500}100%{box-shadow:0 0 0 0 #ff252500}}
.pulse{animation:pulse 2s infinite}
#stickyCta{position:fixed;left:12px;right:12px;bottom:12px;z-index:9;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#160808f2;border:1px solid #ff252555;border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 10px 30px #000c}
#stickyCta .sp{font-size:13px;font-weight:800}
#stickyCta .sp small{display:block;font-size:11px;color:var(--mut);font-weight:600}
#stickyCta .go{background:var(--rose);color:#fff;font-weight:800;border-radius:10px;padding:11px 18px;text-decoration:none;font-size:14px;white-space:nowrap}
.reveal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.feed-card{
  position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);background:linear-gradient(165deg,#2b0b0b,#120404);
}
.ph-img{position:absolute;inset:0;background-size:cover;background-position:center}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{
  width:36px;height:36px;border-radius:50%;background:#ff2525e6;color:#fff;
  display:grid;place-items:center;font-size:14px;box-shadow:0 6px 16px #000000aa;
}
.fb{
  position:fixed;left:50%;bottom:100px;z-index:9;padding:13px 24px;border-radius:99px;
  font-weight:900;font-size:15px;letter-spacing:1.4px;box-shadow:0 14px 34px #000000aa;
  animation:fbpop .35s cubic-bezier(.22,1.4,.36,1);white-space:nowrap;
}
.fb.warn{background:var(--red);color:#fff;box-shadow:0 14px 34px #ff252555}
.fb.ok{background:#22c55e;color:#04150c;box-shadow:0 14px 34px #22c55e44}
.fb.mid{background:#f5b301;color:#221a00}
@keyframes fbpop{from{opacity:0;transform:translate(-50%,18px) scale(.7)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.shake{animation:shake .55s ease}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.confetti{position:fixed;inset:0;z-index:8;pointer-events:none}
.disc{font-size:12px;color:#7a7a7a;text-align:center;margin-top:22px;line-height:1.55}
@media (max-width:380px){
  h1{font-size:27px}
  .qtext{font-size:20px}
  .ring{width:158px;height:158px}
  .sinais{font-size:10.5px;padding:5px 9px}
  .hero-wm{font-size:42px}
}
</style>
</head>
<body>
<div class="bg fx1"></div>
<div class="bg fx2"></div>
<div id="app"></div>
<script>
const BASE=[
 {id:"gender",t:()=>"Você é?",opts:[{l:"Homem",g:"m"},{l:"Mulher",g:"f"}]},
 {id:"horas",t:p=>`Quantas horas por dia ${p} some no TikTok — longe de você?`,s:"Some horas no TikTok longe de você",
  opts:[{l:"Quase nenhuma",v:0},{l:"Algumas",v:1},{l:"Muitas",v:2},{l:"Tantas que você já perdeu a conta",v:3}]},
 {id:"tela",t:(p,pe)=>`Já aconteceu de você chegar perto e ${pe} travar, virar ou esconder o celular na hora?`,s:"Trava ou vira o celular quando você chega",
  opts:[{l:"Nunca",v:0},{l:"Raramente",v:1},{l:"Já aconteceu algumas vezes",v:2},{l:"É o padrão — toda vez",v:3}]},
 {id:"tempo",t:()=>"Quanto o TikTok já roubou do tempo de vocês?",s:"O TikTok já roubou tempo de vocês",
  opts:[{l:"Nada",v:0},{l:"Um pouco",v:1},{l:"Muito — já sentimos falta",v:2},{l:"Tanto que já brigamos por isso",v:3}]},
 {id:"curtidas",t:(p,pe)=>`Você já pegou ${pe} curtindo ou comentando vídeo de gente atraente?`,s:"Curte vídeo de gente atraente",
  opts:[{l:"Nunca",v:0},{l:"Uma vez",v:1},{l:"Várias vezes",v:2},{l:"Constantemente — e me incomoda",v:3}]},
 {id:"conexao",t:()=>"Como está a conexão de vocês hoje?",s:"Conexão fria, como estranhos",
  opts:[{l:"Firme",v:0},{l:"Boa",v:1},{l:"Fria",v:2},{l:"Distante como estranhos",v:3}]},
 {id:"brigas",t:()=>"Vocês já brigaram por causa do celular ou do TikTok?",s:"Brigas por causa do celular/TikTok",
  opts:[{l:"Nunca",v:0},{l:"Uma vez",v:1},{l:"Algumas vezes",v:2},{l:"Muitas — e nada mudou",v:3}]},
 {id:"confianca",t:(p,pe)=>`Se você pudesse ver tudo que ${pe} assiste no TikTok, teria coragem de olhar?`,s:"Não teria coragem de olhar",
  opts:[{l:"Olharia sem medo",v:0},{l:"Teria receio do que ver",v:1},{l:"Não teria coragem",v:2},{l:"Já sei que não confio",v:3}]},
 {id:"checar",t:(p,pe)=>`Você já pensou em verificar o que ${pe} vê no TikTok?`,s:"Quer verificar o que ele/ela vê no TikTok",
  opts:[{l:"Nunca pensei",v:0},{l:"Passou pela minha cabeça",v:1},{l:"Penso sempre",v:2},{l:"Estou pensando agora",v:3}]},
 {id:"celular",t:(p,pe)=>`Hoje, quem ocupa mais espaço: você ou o celular de ${p}?`,s:"O celular ocupa o espaço de você",
  opts:[{l:"Eu ocupo",v:0},{l:"Às vezes o celular",v:1},{l:"Mais o celular",v:2},{l:"O celular — e você sabe",v:3}]}
];
const CONDS=[
 {id:"c_planos",trigger:"horas",min:2,bonus:true,s:"Cancelou planos de última hora e ficou no celular",
  t:(p,pe)=>`Nos últimos meses, ${pe} já cancelou planos ou desmarcou saídas de última hora — e depois ficou mexendo no celular?`,
  opts:[{l:"Nunca",v:0},{l:"Uma vez",v:1},{l:"Algumas vezes",v:2},{l:"Várias vezes e sem explicação",v:3}]},
 {id:"c_tela",trigger:"tela",min:2,bonus:true,s:"Celular sempre de costas ou fora de alcance",
  t:(p,pe)=>`O celular ${po(pe)} vive de costas, no mudo ou fora do seu alcance?`,
  opts:[{l:"Não reparei",v:0},{l:"Às vezes",v:1},{l:"Frequentemente",v:2},{l:"Sempre",v:3}]},
 {id:"c_check",trigger:"checar",min:2,bonus:true,s:"Já verificou o celular por desconfiança",
  t:(p,pe)=>`Você já mexeu no celular ${po(pe)} ou leu notificações escondidas por desconfiança?`,
  opts:[{l:"Nunca",v:0},{l:"Passei a mão uma vez",v:1},{l:"Várias vezes",v:2},{l:"Sim, com frequência",v:3}]}
];
const CATS=[
 {ids:["tela","curtidas","brigas","c_tela"],name:"Tela Fechada"},
 {ids:["horas","tempo","conexao","celular","c_planos"],name:"Conexão Rompida"},
 {ids:["confianca","checar","c_check"],name:"Confiança Abalada"}
];
const app=document.getElementById("app");
let st=null;
let RESULT=null;
let calcTimer=null;
let soundOn=localStorage.getItem("ck_sound")!=="0";
let ac=null;

function freshState(stage){
  return {stage:stage||"intro",idx:0,gender:null,answers:[],seq:BASE.slice(),
    answered:0,sinais:0,halfSeen:false,handle:"",handleSeen:false};
}
st=freshState();

function pc(){return st.gender==="m"?"sua esposa/namorada":"seu marido/namorado"}
function pe(){return st.gender==="m"?"ela":"ele"}
function po(x){return x==="ele"?"dele":"dela"}

function tone(f,d,type,vol,delay){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"sine";
    o.frequency.value=f;
    const t=ac.currentTime+(delay||0);
    g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(vol||.05,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);
    g.connect(ac.destination);
    o.start(t);
    o.stop(t+d+.06);
  }catch(e){}
}
function sndAnswer(v){
  if(v>=3){tone(160,.16,"square",.05);tone(120,.2,"sine",.05,.09)}
  else if(v===2){tone(200,.15,"sawtooth",.04)}
  else if(v===1){tone(440,.09,"sine",.04)}
  else{tone(660,.1,"sine",.045);tone(880,.12,"sine",.04,.07)}
}
function sndResult(pct){
  if(pct<35){[523,659,784].forEach((f,i)=>tone(f,.22,"sine",.05,i*.13))}
  else if(pct<65){[440,554].forEach((f,i)=>tone(f,.2,"sine",.05,i*.15))}
  else{[330,262,196].forEach((f,i)=>tone(f,.3,"sawtooth",.045,i*.16))}
}
function sndBonus(){tone(880,.1,"triangle",.05);tone(1320,.14,"triangle",.045,.1)}

function logoSvg(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">
  <circle cx="28" cy="28" r="17" fill="none" stroke="currentColor" stroke-width="5"/>
  <path d="M41 41 54 54" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
  <g transform="translate(17.6,17.2) scale(0.95)">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#ff2525"/>
    <path d="M12 5.4l-1.7 5.7 3.4 2.7-2.5 6" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g></svg>`;
}
function brand(){
  return `<div class="brand">${logoSvg(26)}<span class="wm">Con<i>fere</i></span></div>`;
}
function soundBtn(){
  return `<button class="som${soundOn?"":" off"}" data-action="sound" title="Ligar/desligar som">♪ SOM</button>`;
}
function chips(withSinais){
  const sn=withSinais
    ?`<span class="sinais" id="sinaisChip">DÚVIDA <b>${st.sinais}</b></span>`:"";
  return `<div class="chips">${sn}${soundBtn()}</div>`;
}
function bar(pct,label){
  return `<div class="top">${brand()}${chips(true)}</div>
  <div class="qnum">${label}</div>
  <div class="progress"><i style="width:${pct}%"></i></div>`;
}

function viewIntro(){
  return `<div class="top end">${chips(false)}</div>
  <div class="card" style="margin-top:18px">
    <div class="hero">
      <div class="appicon">${logoSvg(66)}</div>
      <div class="wm hero-wm">Con<i>fere</i></div>
      <div class="slogan">Descubra a verdade<br>antes que seja tarde.</div>
      <div class="rule"></div>
    </div>
    <h1 style="text-transform:uppercase;text-align:center;margin-top:20px">Espione os vídeos que seu parceiro vê no TTK</h1>
    <button class="btn" data-action="start">QUERO SABER A VERDADE →</button>
  </div>
  <p class="disc">O Confere é um quiz informativo e não substitui aconselamento profissional.</p>`;
}

function viewQuestion(){
  const q=st.seq[st.idx];
  const text=q.t(pc(),pe());
  const badges="ABCDEFGHIJ";
  const bonus=q.bonus?`<div class="bonus">★ Bônus — esta pergunta apareceu só para você</div>`:"";
  const opts=q.opts.map((o,i)=>{
    const attrs=(o.g?`data-g="${o.g}"`:"")+(o.v!==undefined?` data-v="${o.v}"`:"");
    return `<button class="opt" data-action="answer" ${attrs}>
      <span class="badge">${badges[i]}</span><span>${o.l}</span></button>`;
  }).join("");
  const total=st.seq.length;
  const left=total-(st.idx+1);
  const rush=left>0&&left<=3?`<div class="rush">Última${left>1?"s "+left:""} — seu resultado está quase pronto</div>`:"";
  return `${bar(Math.round(((st.idx+1)/total)*100),`Pergunta ${st.idx+1} de ${total}`)}
  <div class="card">
    ${bonus}
    <div class="qtext">${text}</div>
    <div class="opts">${opts}</div>
    ${rush}
  </div>`;
}

function viewHalf(){
  const rest=st.seq.length-st.idx;
  const sn=st.sinais;
  return `${bar(Math.round((st.idx/st.seq.length)*100),"Metade do caminho")}
  <div class="card" style="text-align:center">
    <div class="half-ico">50</div>
    <h2>Metade do caminho — e já dá para ver o padrão</h2>
    <p class="lead">Cada resposta é um espelho. Faltam só ${rest} pergunta${rest===1?"":"s"} para o seu Índice de Dúvida — e ele costuma surpreender. Tem um padrão escondido nas suas respostas que só o cálculo final revela.</p>
    <div class="half-sinais"><b>${sn}</b> ponto${sn===1?"":"s"} de dúvida até agora</div>
    <div style="margin-top:24px"><button class="btn" data-action="continue">QUERO O RESULTADO →</button></div>
  </div>`;
}

function viewCalc(){
  return `${bar(100,"Calculando")}
  <div class="card" style="text-align:center;padding-top:56px;padding-bottom:56px">
    <div class="spin"></div>
    <div class="calc-t">Revelando o que suas respostas escondem...</div>
    <div class="calc-s">Cruzando ${st.answers.length} respostas com o que você realmente sente — o resultado sai em segundos</div>
  </div>`;
}

function viewHandle(){
  const pct=Math.round((st.idx/st.seq.length)*100);
  const isM=st.gender==="m";
  return `${bar(pct,"Verificação")}
  <div class="card">
    <div class="kicker">Antes das perguntas</div>
    <h2>Qual é o @ do TikTok ${isM?"dela":"dele"}?</h2>
    <p class="lead">Digite o @ da conta que você desconfia para personalizar sua verificação.</p>
    <div class="tk-wrap" id="tkWrap">
      <span class="tk-at">@</span>
      <input class="tk-in" id="tkHandle" type="text" placeholder="seu.exemplo"
        maxlength="40" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    </div>
    <div class="tk-err">Digite o @ para continuar</div>
    <p class="micro" style="margin-top:14px">Não pedimos senha. Não avisamos ${isM?"ela":"ele"}. 100% anônimo.</p>
    <div style="margin-top:16px"><button class="btn" data-action="handleGo">CONTINUAR →</button></div>
  </div>`;
}

function viewReveal(){
  const who=st.handle?"@"+st.handle:"Seu cônjuge";
  const isM=st.gender==="m";
  const imgs=isM
    ?["prova%20-%20homem%20-%20confere.png","prova%202%20-%20homens%20-%20confere.png","prova%203%20-%20homens%20-%20confere.png"]
    :["foto%201%20confere.png","foto%202%20confere.png","foto%203%20confere.png"];
  const cards=imgs.map((f,i)=>`
    <div class="feed-card">
      <div class="ph-img" style="background-image:url('img/${f}')"></div>
      <div class="play"><span>&#9654;</span></div>
    </div>`).join("");
  const pct=Math.round((st.idx/st.seq.length)*100);
  return `${bar(pct,"O segredo")}
  <div class="card">
    <div class="kicker">Verificação secreta</div>
    <h2>${who} pode estar vendo vídeos como estes agora</h2>
    <div class="reveal-grid">${cards}</div>
    <p class="lead" style="margin-top:18px">${isM?"Ela":"Ele"} pode estar assistindo conteúdos assim todo dia — e você pode descobrir tudo com uma configuração secreta que quase ninguém conhece.</p>
    <div style="margin-top:22px"><button class="btn" data-action="toAnalise">QUERO VERIFICAR →</button></div>
  </div>`;
}

function viewAnalise(){
  const isM=st.gender==="m";
  const msg=isM?"Nossa que gostoso, sentava muito!":"Nossa que gostosa, posso te visitar?";
  const alvo=st.handle?"@"+st.handle:"seu cônjuge";
  const pct=Math.round((st.idx/st.seq.length)*100);
  return `${bar(pct,"Desconfiança")}
  <div class="card">
    <div class="kicker">Análise de desconfiança</div>
    <h2>É assim que começa — um comentário vira conversa no inbox</h2>
    <div class="chat">
      <div class="chat-head"><div class="chat-av">TT</div>
        <div><div class="chat-name">Inbox do TikTok</div><div class="chat-on"><i></i>online agora</div></div>
      </div>
      <div class="bub-in">${msg}<span class="tm">23:47</span></div>
    </div>
    <p class="lead" style="margin-top:18px">Mensagens como esta chegam todos os dias para quem vive nesses vídeos. E se no inbox de ${alvo} tiver uma conversa assim?</p>
    <div style="margin-top:22px"><button class="btn" data-action="toQuestions">TEM CERTEZA QUE DESEJA CONTINUAR? →</button></div>
  </div>`;
}

function levelOf(pct){
  if(pct<35)return{
    c:"#22c55e",t:"Dúvida Leve",
    d:"Você marcou “nunca” em quase tudo — nenhum sinal visível. Mas repara: quem está 100% tranquila não faz um teste desses até o fim. Este teste mede o que você VÊ. A configuração secreta mostra o que você NÃO vê.",
    tips:[
      "Responder “nunca” em tudo não apaga o motivo que te trouxe até aqui — ele continua aí, cutucando.",
      "O perigo mora no invisível: feed, curtidas e inbox que você nunca viu não aparecem em nenhuma pergunta.",
      "Existe uma diferença enorme entre “acho que está tudo bem” e “EU SEI que está tudo bem”. Só uma delas deixa você dormir em paz."
    ]};
  if(pct<65)return{
    c:"#f5b301",t:"Dúvida em Alta",
    d:"A dúvida já virou rotina: você observa, compara, relembra conversas. E dúvida que não se resolve só cresce quando você não olha de frente.",
    tips:[
      "Cada tela virada dispara a mesma pergunta — e ela segue sem resposta.",
      "Conversar sem informação vira “você está exagerando” — e a dúvida volta, maior.",
      "Você já tentou de tudo menos saber. Chegou a hora de virar o jogo."
    ]};
  return{
    c:"#ff2525",t:"Dúvida Crítica",
    d:"Você não consegue mais confiar sem prova. E viver no “será que?” rouba sono, paz e a relação — toda noite. Sua dúvida merece uma resposta, não mais especulação.",
    tips:[
      "Você já perdeu noites contando os minutos. Isso não é ciúme — é informação faltando.",
      "Sem prova, toda conversa termina em “você está louca/o” — e a dúvida volta dobrada.",
      "A dúvida não vai embora sozinha. Ela só some quando você finalmente sabe."
    ]};
}

function viewResult(){
  const {pct,lv,highlights,profile,strong,answeredN}=RESULT;
  const hi=highlights.length
    ? highlights.map(h=>`<li><span class="dot" style="background:${lv.c}"></span>${h}</li>`).join("")
    : `<li><span class="dot" style="background:${lv.c}"></span>Nenhum sinal visível nas respostas — o resto só vendo por dentro.</li>`;
  const tips=lv.tips.map(t=>`<li>${t}</li>`).join("");
  const low=pct<35;
  return `${bar(100,"Resultado")}
  <div class="card" id="resCard">
    <div class="res-head">
      <div class="kicker">Seu resultado</div>
      <div class="ring" id="ring" style="background:conic-gradient(${lv.c} 0deg,#ffffff12 0deg)">
        <div class="ringIn"><div><span id="num">0</span><em>%</em></div></div>
      </div>
      <div class="pill" style="color:${lv.c};border-color:${lv.c}44;background:${lv.c}1a">${lv.t}</div>
      <div class="prof">Principal fonte da sua dúvida: <strong>${profile}</strong></div>
      <div class="meta">${strong} de ${answeredN} respostas alimentaram sua dúvida</div>
      <div class="who">Análise de ${st.handle?"@"+st.handle:"você"} — feita em 1 minuto</div>
      <div class="res-title">Seu Índice de Dúvida</div>
      <p class="res-desc">${lv.d}</p>
    </div>
    <div class="sect">
      <h3>O que mais alimenta sua dúvida</h3>
      <ul>${hi}</ul>
    </div>
    <div class="sect">
      <h3>Por que a dúvida não vai embora sozinha</h3>
      <ol>${tips}</ol>
    </div>
    <div class="cta-box">
      <div class="kicker">${low?"O passo que falta":"A resposta"}</div>
      <div class="cta-title">${low?"Suas respostas estão limpas — falta conferir o invisível":"Sua dúvida tem resposta — e ela está a um clique de distância"}</div>
      <div class="cta-loss">A dúvida não some sozinha — ela cobra juros toda noite em sono e paz.</div>
      <a class="btn rose pulse" id="cta-checkout" data-action="cta" href="https://pay.cakto.com.br/awfje4i_1188792" target="_blank" rel="noopener">QUERO A RESPOSTA — R$ 49,90</a>
      <div class="cta-note">Menos que uma pizza · pagamento único via Cakto · cartão, Pix ou PicPay</div>
      <div class="trust"><span>100% anônimo</span><span>Sem cadastro</span><span>Resposta na hora</span></div>
    </div>
  </div>
  <p class="disc">O Confere é um quiz informativo e não substitui aconselamento profissional. Suas respostas nunca saem do seu aparelho.</p>
  <a id="stickyCta" data-action="cta" href="https://pay.cakto.com.br/awfje4i_1188792" target="_blank" rel="noopener"><span class="sp">Resposta<small>R$ 49,90 · pagamento único</small></span><span class="go">VER →</span></a>
  <div style="height:78px"></div>`;
}

function render(){
  let html="";
  if(st.stage==="intro")html=viewIntro();
  else if(st.stage==="question")html=viewQuestion();
  else if(st.stage==="handle")html=viewHandle();
  else if(st.stage==="reveal")html=viewReveal();
  else if(st.stage==="analise")html=viewAnalise();
  else if(st.stage==="halfway")html=viewHalf();
  else if(st.stage==="calc")html=viewCalc();
  else html=viewResult();
  app.classList.remove("fade");
  void app.offsetWidth;
  app.innerHTML=html;
  app.classList.add("fade");
  if(st.stage==="result")animateResult();
}

function animateResult(){
  const ring=document.getElementById("ring");
  const num=document.getElementById("num");
  const pct=RESULT.pct,c=RESULT.lv.c;
  const t0=performance.now(),dur=1400;
  function frame(t){
    const k=Math.min(1,(t-t0)/dur);
    const e=1-Math.pow(1-k,3);
    const val=Math.round(pct*e);
    if(num)num.textContent=val;
    if(ring)ring.style.background=`conic-gradient(${c} ${val*3.6}deg,#ffffff12 0deg)`;
    if(k<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function feedback(v){
  const el=document.createElement("div");
  el.className="fb "+(v>=2?"warn":v===1?"mid":"ok");
  el.textContent=v>=2?"+1 DÚVIDA":v===1?"DÚVIDA LEVE":"POR ORA, OK";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),750);
}
function bumpSinais(){
  const chip=document.getElementById("sinaisChip");
  if(!chip)return;
  chip.innerHTML=`DÚVIDA <b>${st.sinais}</b>`;
  chip.classList.remove("bump");
  void chip.offsetWidth;
  chip.classList.add("bump");
}
function insertConds(qid,v){
  const add=CONDS.filter(c=>c.trigger===qid&&v>=c.min);
  if(add.length){
    st.seq.splice(st.idx+1,0,...add);
    sndBonus();
  }
}
function startCalc(){
  st.stage="calc";
  render();
  calcTimer=setTimeout(()=>{
    st.stage="result";
    render();
    sndResult(RESULT.pct);
    if(RESULT.pct<35)confetti();
    else if(RESULT.pct>=65){
      const card=document.getElementById("resCard");
      if(card){card.classList.add("shake");setTimeout(()=>card.classList.remove("shake"),600)}
    }
  },1700);
}
function advance(){
  st.lock=false;
  st.idx++;
  if(st.idx>=st.seq.length){
    computeResult();
    startCalc();
  }else if(st.gender&&!st.handleSeen){
    st.handleSeen=true;
    st.stage="handle";
    render();
    setTimeout(()=>{const i=document.getElementById("tkHandle");if(i&&i.focus)i.focus();},60);
  }else if(st.answered===6&&!st.halfSeen){
    st.halfSeen=true;
    st.stage="halfway";
    render();
  }else{
    st.stage="question";
    render();
  }
}

function computeResult(){
  const sum=st.answers.reduce((a,b)=>a+b.v,0);
  const n=st.answers.length;
  const pct=Math.round((sum/(n*3))*100);
  const lv=levelOf(pct);
  const strong=st.answers.filter(a=>a.v>=2).length;
  const highlights=st.answers
    .filter(a=>a.v>=2)
    .sort((a,b)=>b.v-a.v)
    .slice(0,3)
    .map(a=>a.s);
  let profile=lv.t;
  let best=0;
  for(const cat of CATS){
    const w=st.answers
      .filter(a=>cat.ids.includes(a.id)&&a.v>=2)
      .reduce((s,a)=>s+a.v,0);
    if(w>best){best=w;profile=cat.name}
  }
  RESULT={pct,lv,highlights,profile,strong,answeredN:n};
}

function confetti(){
  const c=document.createElement("canvas");
  c.className="confetti";
  document.body.appendChild(c);
  const ctx=c.getContext("2d");
  const W=c.width=window.innerWidth;
  const H=c.height=window.innerHeight;
  const colors=["#ff2525","#ffffff","#a80f0f","#d9d9d9","#ff6b6b"];
  const parts=[];
  for(let i=0;i<130;i++){
    parts.push({
      x:Math.random()*W,y:-20-Math.random()*H*.4,
      vx:(Math.random()-.5)*3.4,vy:2.4+Math.random()*3.6,
      w:5+Math.random()*7,h:7+Math.random()*9,
      rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.24,
      c:colors[i%colors.length],life:1
    });
  }
  const t0=performance.now();
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.x+=p.vx;
      p.y+=p.vy;
      p.vy+=.05;
      p.rot+=p.vr;
      if(t-t0>2600)p.life-=.02;
      if(p.life<=0)continue;
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    if(t-t0<3400)requestAnimationFrame(frame);
    else c.remove();
  }
  requestAnimationFrame(frame);
}

function submitHandle(){
  const inp=document.getElementById("tkHandle");
  const raw=inp&&inp.value?String(inp.value).trim():"";
  if(!raw){
    const w=document.getElementById("tkWrap");
    if(w){w.classList.remove("err");void w.offsetWidth;w.classList.add("err")}
    return;
  }
  st.handle=raw.replace(/^@+/,"");
  sndBonus();
  st.stage="reveal";
  render();
}

app.addEventListener("click",e=>{
  const btn=e.target.closest("[data-action]");
  if(!btn)return;
  const action=btn.dataset.action;
  if(action==="start"){
    st=freshState("question");
    render();
  }else if(action==="answer"){
    if(st.lock)return;
    const q=st.seq[st.idx];
    if(q.id==="gender"&&!btn.dataset.g)return;
    st.lock=true;
    btn.classList.add("sel");
    if(btn.dataset.g)st.gender=btn.dataset.g;
    let v=null;
    if(q.id!=="gender"&&btn.dataset.v!==undefined){
      v=+btn.dataset.v;
      st.answers.push({id:q.id,v:v,s:q.s});
      st.answered++;
      if(v>=2){
        st.sinais++;
        setTimeout(bumpSinais,60);
      }
      feedback(v);
      sndAnswer(v);
    }
    setTimeout(()=>{
      if(v!==null)insertConds(q.id,v);
      advance();
    },v===null?140:430);
  }else if(action==="continue"){
    st.stage="question";
    render();
  }else if(action==="handleGo"){
    submitHandle();
  }else if(action==="toAnalise"){
    sndBonus();
    st.stage="analise";
    render();
  }else if(action==="toQuestions"){
    sndBonus();
    st.stage="question";
    render();
  }else if(action==="cta"){
    document.dispatchEvent(new CustomEvent("ck_cta_click"));
  }else if(action==="sound"){
    soundOn=!soundOn;
    localStorage.setItem("ck_sound",soundOn?"1":"0");
    if(soundOn)tone(760,.1,"sine",.05);
    render();
  }
});

app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target&&e.target.id==="tkHandle")submitHandle();
});

render();
</script>
